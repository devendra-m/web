<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="/css/main.css">
		<script src="/js/main.js"></script>
		<script src="/js/nutrition.js"></script>
	</head>
	<body onload="onload(Foodname)">		
	<div>
	  <div class="header">
	 </div>   	 
	  <div class="content">		    
		 <div class="food">	
			<ul class="rows">
				<li class="row">
					<ul>
						<li class="column-1"><span>Food Name</span></li>
						<li class="column-2"><span>Weight Grams</span></li>
						<li class="column-3"><span>Action</span></li>
					</ul>
				</li>
				<li class="row">
					<ul>
						<li class="column-1">
							<input type="text" class="name" name="name[]"/>
							<input type="hidden" name="id[]"/>
						</li>
						<li class="column-2">
							<input type="text" class="weightGram" name="weightGram[]"/>
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>
				</li>	
				<li class="row">	
					<ul class="template">
						<li class="column-1">
							<input type="text" class="name" name="name[]"/>
							<input type="hidden" name="id[]"/>
						</li>
						<li class="column-2">
							<input type="text" class="weightGram" name="weightGram[]"/>
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>				
					<ul><li class="button"><input type="button" class="add" value="Add More"/></li></ul>
				</li>			
			</ul>
			
		</div>
	  </div>  
	  <div class="bottom">
			
	  </div>
	</body>
</html>
