<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="/css/main.css">
		<script src="/js/main.js"></script>
		<script src="/js/nutrition.js"></script>
	</head>
	<body onload="onload(Foodname)">		
	<div>
	  <div class="header">
	 </div>   	 
	  <div class="content">		
		 <div class="food_main">
		 <div class="title">
			 <span>Enter all food and weight and click "Nutrition Calculate" button</span>
		 </div>    
		 <div class="food">	
			<form>
			<ul class="rows">
				<li class="row">
					<ul>
						<li class="column-1"><span>Food Name</span></li>
						<li class="column-2"><span>Weight Grams</span></li>
						<li class="column-3"><span>Action</span></li>
					</ul>
				</li>
				<li class="row">
					<ul>
						<li class="column-1">
							<input type="text" class="name" name="name[]"/ required>
							<input type="hidden" class="food_id" name="id[]"/>
						</li>
						<li class="column-2">
							<input type="text" class="weightGram" name="weightGram[]"/ required>
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>
				</li>	
				<li class="row">	
					<ul class="template">
						<li class="column-1">
							<input type="text" class="name" name="name[]"/ required>
							<input type="hidden" class="food_id" name="id[]"/>
						</li>
						<li class="column-2">
							<input type="text" class="weightGram" name="weightGram[]"/ required>
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>				
					<ul><li class="button"><input type="button" class="add" value="Add"/></li></ul>
				</li>			
			</ul>
			<ul class="submit"><li><input type="submit" class="calculate" value="Nutrition Calculate"/></li></ul>
			</form>
		</div>
		</div>
	  </div>  
	  <div class="bottom">
			
	  </div>
	  <div class="loader">Calculating nutrition ...</div>
	</body>
</html>
