<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Nutrition Calculator</title>
		<link rel="stylesheet" href="/css/main.css">
		<script src="/js/main.js"></script>
		<script src="/js/nutrition.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	<body onload="onload(Foodname)">		
	<div>
	  <div class="header">
	 </div>   	 
	  <div class="content">		
		 <div class="food_main">
		 <h2>Nutrition Calculator</h2>
		 <div class="title">
			 <span>Calculate nutrition amount based on foods selected. Enter food in text box from the list and weight and click "Nutrition Calculate" button.</span>
		 </div>    
		 <div class="food">	
			<form>
			<ul class="rows">
				<li class="row heading">
					<ul>
						<li class="column-1"><span>Food Name</span></li>
						<li class="column-2"><span>Weight Grams</span></li>
						<li class="column-3"></li>
					</ul>
				</li>
				<li class="row">
					<ul>
						<li class="column-1">
							<span class="label-field-potrait">Food Name</span>
							<input type="text" class="name" name="name[]" />
							<input type="hidden" class="food_id" name="id[]"/>
						</li>
						<li class="column-2">
							<span class="label-field-potrait">Weight Grams</span>
							<input type="text" class="weightGram" name="weightGram[]" />
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>
				</li>	
				<li class="row">	
					<ul class="template">
						<li class="column-1">
							<span class="label-field-potrait">Food Name</span>
							<input type="text" class="name" name="name[]" />
							<input type="hidden" class="food_id" name="id[]"/>
						</li>
						<li class="column-2">
							<span class="label-field-potrait">Weight Grams</span>
							<input type="text" class="weightGram" name="weightGram[]" />
						</li>
						<li class="column-3">
							<input type="button" class="delete" onclick="Foodname.deleteRow(this)" value="Delete"/>
						</li>							
					</ul>				
					<ul><li class="button"><input type="button" class="add" value="Add"/></li></ul>
				</li>			
			</ul>
			<ul class="submit"><li><input type="submit" class="calculate" value="Nutrition Calculate"/></li></ul>
			</form>
		</div>
		</div>
	  </div>  
	  <div class="bottom">
			
	  </div>
	  <div class="loader"><div class="loader-content"><span class="loader-text">Calculating...</span></div></div>
	</body>
</html>
